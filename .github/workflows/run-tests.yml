name: All Tests

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional go test -run regex to narrow the unit/integration tests"
        required: false
        default: ""

permissions:
  contents: read

concurrency: # Auto-cancel existing runs in the PR when a new commit is pushed
  group: run-tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # For pull_request: use the head of the PR branch (not the merge branch which is the default!)
  # For push: use the pushed commit.
  COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  PR_BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
  DOCKER_COMPOSE_FILE: ./develop/github/docker-compose.yml
  TEMPORAL_VERSION_CHECK_DISABLED: 1
  MAX_TEST_ATTEMPTS: 3
  # Fork runs on 16GB standard arm runners (upstream: 8-core); 3 shards OOM the -race cass_es functional binary.
  SHARD_COUNT: 6 # NOTE: must match shard count in optimize-test-sharding.yml
  # Prints per-attempt and final pass/fail counts from the merged JUnit report written by tools/testrunner.
  SEAL_JUNIT_SUMMARY_PY: |
    import glob, re, sys
    import xml.etree.ElementTree as ET

    SUF = re.compile(r" \(retry (\d+)\)(?: \(final\))?$")


    def split(name):
        name = name or ""
        m = SUF.search(name)
        if not m:
            return name, 1
        return name[: m.start()], int(m.group(1)) + 1


    files = sorted(f for f in glob.glob(".testoutput/junit.*.xml") if not f.endswith("junit.crash.xml"))
    if not files:
        print("[seal-test-summary] no JUnit reports found under .testoutput/")
        sys.exit(1)
    results = {}
    alerts = []
    for path in files:
        for suite in ET.parse(path).getroot().iter("testsuite"):
            sname, _ = split(suite.get("name"))
            for tc in suite.iter("testcase"):
                if sname == "ALERTS":
                    alerts.append(tc.get("name"))
                    continue
                cname, attempt = split(tc.get("name"))
                if tc.find("failure") is not None or tc.find("error") is not None:
                    status = "failed"
                elif tc.find("skipped") is not None:
                    status = "skipped"
                else:
                    status = "passed"
                results.setdefault((sname, cname), {})[attempt] = status
    per_attempt = {}
    for runs in results.values():
        for attempt, status in runs.items():
            per_attempt.setdefault(attempt, {"passed": 0, "skipped": 0, "failed": 0})[status] += 1
    for attempt in sorted(per_attempt):
        c = per_attempt[attempt]
        label = "initial run" if attempt == 1 else "re-run of the previous attempt's failures"
        print(f"[seal-test-summary] attempt {attempt} ({label}): {sum(c.values())} tests, {c['passed']} passed, {c['skipped']} skipped, {c['failed']} failed")
    final = {k: runs[max(runs)] for k, runs in results.items()}
    passed = sum(s == "passed" for s in final.values())
    skipped = sum(s == "skipped" for s in final.values())
    failed = sorted(k for k, s in final.items() if s == "failed")
    retried = sorted(k for k, runs in results.items() if len(runs) > 1 and runs[max(runs)] == "passed")
    print(f"[seal-test-summary] FINAL RESULT: {len(final)} tests, {passed} passed, {skipped} skipped, {len(failed)} failed")
    if not final:
        print("[seal-test-summary] ERROR: the JUnit report contains no test results")
        sys.exit(1)
    if retried:
        print(f"[seal-test-summary] {len(retried)} test(s) failed on an earlier attempt and passed when re-run by upstream's tools/testrunner (--max-attempts):")
        for s, c in retried:
            print(f"[seal-test-summary]   passed on retry: {s} {c}")
    for s, c in failed:
        print(f"[seal-test-summary]   FAILED: {s} {c}")
    for a in alerts:
        print(f"[seal-test-summary]   testrunner alert: {a}")
    sys.exit(1 if failed else 0)

jobs:
  test-setup:
    name: Test setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      job_matrix: ${{ steps.build_matrix.outputs.job_matrix }}
      full_test_reason: ${{ steps.determine_scope.outputs.full_test_reason }}
      runner_arm: ${{ steps.configure_runners.outputs.runner_arm }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.COMMIT }}
          fetch-depth: 0

      - name: Fetch base branch
        if: ${{ github.event_name == 'pull_request' }}
        run: git fetch origin ${{ github.event.pull_request.base.ref }}:${{ github.event.pull_request.base.ref }}

      - name: Compute merge base
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          MERGE_BASE="$(git merge-base "${{ env.COMMIT }}" "${{ github.event.pull_request.base.ref }}")"
          echo "MERGE_BASE=${MERGE_BASE}" >> "$GITHUB_ENV"

      # If possible, run the "abridged" jobs on PRs to save time.
      #
      # The goal is to still cover all persistence code paths:
      #   1. SQL
      #   2. NoSQL (ie Cassandra)
      #   3. Elasticsearch/OpenSearch
      # All other jobs for the remaining databases only run a small set of smoke tests.
      #
      # Exceptions to this optimization:
      #   1. commit is not a PR
      #   2. `test-all-dbs` label set on PR
      #   3. changes to persistence packages were made
      - name: Determine test scope
        id: determine_scope
        run: |
          FULL_TEST_REASON=""

          event_name="${{ github.event_name }}"
          labels='${{ toJson(github.event.pull_request.labels.*.name) }}'
          merge_base="${MERGE_BASE:-}"

          echo "event_name=$event_name"
          echo "labels=$labels"
          echo "merge_base=$merge_base"

          # Push events (main, release branches) run all tests on all DBs
          if [[ "$event_name" == "push" ]]; then
            FULL_TEST_REASON="Running full tests on all DBs (push event)."
          # Check for test-all-dbs label
          elif echo "$labels" | jq -e 'any(. == "test-all-dbs")' > /dev/null 2>&1; then
            FULL_TEST_REASON="Running full tests on all DBs (test-all-dbs label)."
          # Check for persistence code changes
          elif [[ -n "$merge_base" ]]; then
            echo "Changed persistence files:"
            git diff --name-only "$merge_base" "$COMMIT" | grep -E "^(common/persistence/|schema/)" || echo "(none)"
            if git diff --name-only "$merge_base" "$COMMIT" | grep -qE "^(common/persistence/|schema/)"; then
              FULL_TEST_REASON="Running full tests on all DBs (persistence code changes)."
            fi
          fi

          echo "full_test_reason=$FULL_TEST_REASON" >> "$GITHUB_OUTPUT"

      - name: ${{ steps.determine_scope.outputs.full_test_reason && 'ℹ️ Full tests' || 'ℹ️ Smoke tests' }}
        run: echo "::notice::${{ steps.determine_scope.outputs.full_test_reason || 'Running smoke tests on extended DBs. Add the test-all-dbs label to run all tests on all DBs.' }}"

      - name: Configure runners
        id: configure_runners
        run: |
          # Use 8-core runners for temporalio org, standard runners for forks
          if [[ "${{ github.repository_owner }}" == "temporalio" ]]; then
            runner_arm="ubuntu-24.04-arm64-8-cores"
          else
            runner_arm="ubuntu-24.04-arm"
          fi
          echo "runner_arm=$runner_arm" >> "$GITHUB_OUTPUT"

      # Primary DBs always get full tests, extended DBs get smoke tests (1 job) in abridged PRs.
      - name: Build job matrix
        id: build_matrix
        env:
          FULL_TEST_REASON: ${{ steps.determine_scope.outputs.full_test_reason }}
          DB_CONFIGS: |
            cass_es:
              persistence_type: nosql
              persistence_driver: cassandra
              containers: [cassandra, elasticsearch]
              required: true
            cass_es8:
              persistence_type: nosql
              persistence_driver: cassandra
              containers: [cassandra, elasticsearch8]
            cass_os2:
              persistence_type: nosql
              persistence_driver: cassandra
              containers: [cassandra, opensearch2]
            cass_os3:
              persistence_type: nosql
              persistence_driver: cassandra
              containers: [cassandra, opensearch3]
            sqlite:
              persistence_type: sql
              persistence_driver: sqlite
              containers: []
            mysql8:
              persistence_type: sql
              persistence_driver: mysql8
              containers: [mysql]
            postgres12:
              persistence_type: sql
              persistence_driver: postgres12
              containers: [postgresql]
              required: true
            postgres12_pgx:
              persistence_type: sql
              persistence_driver: postgres12_pgx
              containers: [postgresql]
          JOB_TYPES: |
            functest:
              cmd: make functional-test-coverage
              test_timeout: 35m
              github_timeout: 40
              sharded: true
            smoke:
              cmd: make functional-test-coverage
              # 5m/10m is too short on the fork's 4-core runner: -race compile alone eats the 5m budget.
              test_timeout: 12m
              github_timeout: 17
              test_args: '"-run=TestActivityTestSuite|TestSignalWorkflowTestSuite|TestWorkflowTestSuite"'
            ndc:
              cmd: make functional-test-ndc-coverage
              test_timeout: 10m
              github_timeout: 15
            xdc:
              cmd: make functional-test-xdc-coverage
              test_timeout: 30m
              github_timeout: 35
        run: |
          # Convert YAML inputs to JSON for jq.
          DBS_JSON=$(yq -o=json <<< "$DB_CONFIGS")
          JOBS_JSON=$(yq -o=json <<< "$JOB_TYPES")

          # Build the job matrix as a JSON array.
          MATRIX=$(
            jq -c -n \
              --argjson dbs "$DBS_JSON" \
              --argjson jobs "$JOBS_JSON" \
              --argjson shard_count "$SHARD_COUNT" \
              --arg full_test_reason "$FULL_TEST_REASON" \
            '
            [
              $dbs | to_entries[] as $db |

              # Full test suite for required DBs (or all DBs when full_test_reason is set).
              (if $db.value.required or ($full_test_reason != "") then
                $jobs | to_entries[] | select(.key != "smoke")
              else
                $jobs | to_entries[] | select(.key == "smoke")
              end) as $job |

              # Base entry: merge db config + job config + name
              ($db.value + ($job.value | del(.sharded)) + {name: $db.key}) as $base |

              # If sharded, emit one entry per shard; otherwise emit one entry
              if $job.value.sharded then
                range($shard_count) as $i |
                $base + {
                  display_name: "shard\($i)",
                  shard_index: $i,
                  total_shards: $shard_count
                }
              else
                $base + {display_name: $job.key}
              end
            ]
            '
          )

          echo "job_matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Generated $(jq length <<< "$MATRIX") jobs"

  pre-build:
    name: Pre-build for cache
    needs: test-setup
    runs-on: ${{ needs.test-setup.outputs.runner_arm }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.COMMIT }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: false # do our own caching

      - name: Restore dependencies
        id: restore-deps
        uses: actions/cache/restore@v5
        with:
          path: ~/go/pkg/mod
          key: go-${{ runner.os }}${{ runner.arch }}-${{ hashFiles('go.mod') }}-deps-${{ hashFiles('go.sum') }}

      - run: make pre-build-functional-test-coverage

      - name: Save dependencies
        uses: actions/cache/save@v5
        if: ${{ steps.restore-deps.outputs.cache-hit != 'true' }}
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.restore-deps.outputs.cache-primary-key }}

      - name: Save build outputs
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/go-build
          key: go-${{ runner.os }}${{ runner.arch }}-build-${{ env.COMMIT }}

  misc-checks:
    name: Misc checks
    needs: [pre-build, test-setup]
    runs-on: ${{ needs.test-setup.outputs.runner_arm }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.COMMIT }}
          # buf-breaking tries to compare HEAD against merge base so we need to be able to find it
          fetch-depth: 100

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: false # do our own caching

      - name: Restore dependencies
        uses: actions/cache/restore@v5
        with:
          path: ~/go/pkg/mod
          key: go-${{ runner.os }}${{ runner.arch }}-${{ hashFiles('go.mod') }}-deps-${{ hashFiles('go.sum') }}

      - name: Restore build outputs
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/go-build
          key: go-${{ runner.os }}${{ runner.arch }}-build-${{ env.COMMIT }}

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: GOOS=windows GOARCH=amd64 make clean-bins bins

      - run: GOOS=darwin GOARCH=arm64 make clean-bins bins

      - run: make clean-bins ci-build-misc

  unit-test:
    name: Unit test
    needs: [pre-build, test-setup]
    runs-on: ${{ needs.test-setup.outputs.runner_arm }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.COMMIT }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: false # do our own caching

      - name: Restore dependencies
        uses: actions/cache/restore@v5
        with:
          path: ~/go/pkg/mod
          key: go-${{ runner.os }}${{ runner.arch }}-${{ hashFiles('go.mod') }}-deps-${{ hashFiles('go.sum') }}

      - name: Restore build outputs
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/go-build
          key: go-${{ runner.os }}${{ runner.arch }}-build-${{ env.COMMIT }}

      - name: Run unit tests
        timeout-minutes: 20
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          if [ -n "$TEST_FILTER" ]; then
            TEST_ARGS="\"-run=${TEST_FILTER}\"" TEST_TIMEOUT=15m ./develop/github/monitor_test.sh make unit-test-coverage
          else
            TEST_TIMEOUT=15m ./develop/github/monitor_test.sh make unit-test-coverage
          fi

      - name: Summarize test results
        if: ${{ !cancelled() }}
        run: python3 -c "$SEAL_JUNIT_SUMMARY_PY"

      - name: Print memory snapshot
        if: always()
        run: if [ -f /tmp/memory_snapshot.txt ]; then cat /tmp/memory_snapshot.txt; fi

      - name: Generate crash report
        if: failure() # if the tests failed, we would expect one JUnit XML report per attempt; otherwise it must have crashed
        run: |
          [ "$(find .testoutput -maxdepth 1 -name 'junit.*.xml' | wc -l)" -lt "$MAX_TEST_ATTEMPTS" ] &&
            CRASH_REPORT_NAME="$GITHUB_JOB" make report-test-crash

      - name: Generate test summary
        uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() }}
        with:
          report_paths: ./.testoutput/junit.*.xml
          detailed_summary: true
          check_annotations: false
          annotate_only: true
          skip_annotations: true

      - name: Get job ID
        id: get_job_id
        uses: ./.github/actions/get-job-id
        with:
          job_name: Unit test
          run_id: ${{ github.run_id }}

      - name: Upload test results to GitHub
        # Can't pin to major because the action linter doesn't recognize the include-hidden-files flag.
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: junit-xml--${{ github.run_id }}--${{ steps.get_job_id.outputs.job_id }}--${{ github.run_attempt }}--unit-test
          path: ./.testoutput/junit.*.xml
          include-hidden-files: true
          retention-days: 28

  integration-test:
    name: Integration test
    needs: [pre-build, test-setup]
    runs-on: ${{ needs.test-setup.outputs.runner_arm }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.COMMIT }}

      - name: Start containerized dependencies
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: ${{ env.DOCKER_COMPOSE_FILE }}
          services: |
            cassandra
            mysql
            postgresql
          down-flags: -v

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: false # do our own caching

      - name: Restore dependencies
        uses: actions/cache/restore@v5
        with:
          path: ~/go/pkg/mod
          key: go-${{ runner.os }}${{ runner.arch }}-${{ hashFiles('go.mod') }}-deps-${{ hashFiles('go.sum') }}

      - name: Restore build outputs
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/go-build
          key: go-${{ runner.os }}${{ runner.arch }}-build-${{ env.COMMIT }}

      - name: Wait for containerized dependencies to be healthy
        run: |
          # Word splitting is intentional here.
          # shellcheck disable=SC2046
          docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} up --wait $(docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} ps --services)

      - name: Run integration test
        timeout-minutes: 15
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          if [ -n "$TEST_FILTER" ]; then
            TEST_ARGS="\"-run=${TEST_FILTER}\"" ./develop/github/monitor_test.sh make integration-test-coverage
          else
            ./develop/github/monitor_test.sh make integration-test-coverage
          fi

      - name: Summarize test results
        if: ${{ !cancelled() }}
        run: python3 -c "$SEAL_JUNIT_SUMMARY_PY"

      - name: Print memory snapshot
        if: always()
        run: if [ -f /tmp/memory_snapshot.txt ]; then cat /tmp/memory_snapshot.txt; fi

      - name: Generate crash report
        if: failure() # if the tests failed, we would expect one JUnit XML report per attempt; otherwise it must have crashed
        run: |
          [ "$(find .testoutput -maxdepth 1 -name 'junit.*.xml' | wc -l)" -lt "$MAX_TEST_ATTEMPTS" ] &&
            CRASH_REPORT_NAME="$GITHUB_JOB" make report-test-crash

      - name: Generate test summary
        uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() }}
        with:
          report_paths: ./.testoutput/junit.*.xml
          detailed_summary: true
          check_annotations: false
          annotate_only: true
          skip_annotations: true

      - name: Get job ID
        id: get_job_id
        uses: ./.github/actions/get-job-id
        with:
          job_name: Integration test
          run_id: ${{ github.run_id }}

      - name: Upload test results to GitHub
        # Can't pin to major because the action linter doesn't recognize the include-hidden-files flag.
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: junit-xml--${{ github.run_id }}--${{ steps.get_job_id.outputs.job_id }}--${{ github.run_attempt }}--integration-test
          path: ./.testoutput/junit.*.xml
          include-hidden-files: true
          retention-days: 28

      - name: Tear down docker compose
        if: ${{ always() }}
        run: |
          docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} down -v

  # Root job name includes matrix details so it is unique per job variant.
  # This MUST stay in sync with the `job_name` passed to the job-id action below.
  functional-test:
    # Display name shown in the UI. The job-id lookup uses this exact value.
    name: Functional test (${{ matrix.name }}, ${{ matrix.display_name }})
    needs: [pre-build, test-setup]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.test-setup.outputs.job_matrix) }}
    runs-on: ${{ needs.test-setup.outputs.runner_arm }}
    timeout-minutes: 55
    env:
      PERSISTENCE_TYPE: ${{ matrix.persistence_type }}
      PERSISTENCE_DRIVER: ${{ matrix.persistence_driver }}
      TEST_TIMEOUT: ${{ matrix.test_timeout }}
    steps:
      - uses: ScribeMD/docker-cache@0.3.7
        with:
          key: docker-${{ runner.os }}${{ runner.arch }}-${{ hashFiles(env.DOCKER_COMPOSE_FILE) }}

      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.COMMIT }}

      - name: Start containerized dependencies
        if: ${{ toJson(matrix.containers) != '[]' }}
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: ${{ env.DOCKER_COMPOSE_FILE }}
          services: "${{ join(matrix.containers, '\n') }}"
          down-flags: -v

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: false # do our own caching

      - name: Restore dependencies
        uses: actions/cache/restore@v5
        with:
          path: ~/go/pkg/mod
          key: go-${{ runner.os }}${{ runner.arch }}-${{ hashFiles('go.mod') }}-deps-${{ hashFiles('go.sum') }}

      - name: Restore build outputs
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/go-build
          key: go-${{ runner.os }}${{ runner.arch }}-build-${{ env.COMMIT }}

      - name: Get job ID
        id: get_job_id
        uses: ./.github/actions/get-job-id
        with:
          job_name: Functional test (${{ matrix.name }}, ${{ matrix.display_name }})
          run_id: ${{ github.run_id }}

      - name: ${{ matrix.display_name == 'smoke' && 'ℹ️ Smoke test' || 'ℹ️ Full test' }}
        run: echo "::notice::${{ matrix.display_name == 'smoke' && 'This is a smoke test. Add the test-all-dbs label to run all tests on all DBs.' || needs.test-setup.outputs.full_test_reason }}"

      - name: Wait for containerized dependencies to be healthy
        if: ${{ toJson(matrix.containers) != '[]' }}
        run: |
          # Word splitting is intentional here.
          # shellcheck disable=SC2046
          docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} up --wait $(docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} ps --services)

      - name: Run functional test
        timeout-minutes: ${{ matrix.github_timeout }}
        run: ./develop/github/monitor_test.sh ${{ matrix.cmd }}
        env:
          TEST_TOTAL_SHARDS: ${{ matrix.total_shards }}
          TEST_SHARD_INDEX: ${{ matrix.total_shards && matrix.shard_index }} # guard with total_shards to avoid falsy eval of shard_index=0
          TEST_ARGS: "${{ matrix.test_args }}"
          TEMPORAL_TEST_LOG_FILE: ${{ github.workspace }}/.testoutput/debug.log
          TEMPORAL_TEST_LOG_LEVEL: info

      - name: Summarize test results
        if: ${{ !cancelled() }}
        run: python3 -c "$SEAL_JUNIT_SUMMARY_PY"

      - name: Dump container logs
        if: ${{ failure() && toJson(matrix.containers) != '[]' }}
        run: docker compose -f ${{ env.DOCKER_COMPOSE_FILE }} logs --no-color

      - name: Print memory snapshot
        if: always()
        run: if [ -f /tmp/memory_snapshot.txt ]; then cat /tmp/memory_snapshot.txt; fi

      - name: Generate crash report
        if: failure() # if the tests failed, we would expect one JUnit XML report per attempt; otherwise it must have crashed
        run: |
          [ "$(find .testoutput -maxdepth 1 -name 'junit.*.xml' | wc -l)" -lt "$MAX_TEST_ATTEMPTS" ] &&
            CRASH_REPORT_NAME="$GITHUB_JOB" make report-test-crash

      - name: Generate test summary
        uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() }}
        with:
          report_paths: ./.testoutput/junit.*.xml
          detailed_summary: true
          check_annotations: false
          annotate_only: true
          skip_annotations: true

      - name: Upload test results to GitHub
        # Can't pin to major because the action linter doesn't recognize the include-hidden-files flag.
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: junit-xml--${{ github.run_id }}--${{ steps.get_job_id.outputs.job_id }}--${{ github.run_attempt }}--${{ matrix.name }}--${{ matrix.display_name }}--functional-test
          path: ./.testoutput/junit.*.xml
          include-hidden-files: true
          retention-days: 28

      - name: Upload debug logs
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: debug-logs--${{ github.run_id }}--${{ steps.get_job_id.outputs.job_id }}--${{ github.run_attempt }}--${{ matrix.name }}--${{ matrix.display_name }}--functional-test
          path: ${{ github.workspace }}/.testoutput/debug.log
          if-no-files-found: ignore
          retention-days: 14

  mixed-brain-test:
    name: Mixed brain test
    needs: [pre-build, test-setup]
    runs-on: ${{ needs.test-setup.outputs.runner_arm }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.COMMIT }}

      - name: Start PostgreSQL
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: ${{ env.DOCKER_COMPOSE_FILE }}
          services: postgresql
          down-flags: -v

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Restore dependencies
        uses: actions/cache/restore@v5
        with:
          path: ~/go/pkg/mod
          key: go-${{ runner.os }}${{ runner.arch }}-${{ hashFiles('go.mod') }}-deps-${{ hashFiles('go.sum') }}

      - name: Restore build outputs
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/go-build
          key: go-${{ runner.os }}${{ runner.arch }}-build-${{ env.COMMIT }}

      - name: Install PostgreSQL schema
        run: make install-schema-postgresql12

      - name: Run mixed brain test
        timeout-minutes: 20
        run: ./develop/github/monitor_test.sh make mixed-brain-test
        env:
          TEST_TIMEOUT: 18m
          MIXED_BRAIN_TEST_DURATION: 5m
          PERSISTENCE_DRIVER: postgres12

      - name: Print memory snapshot
        if: always()
        run: if [ -f /tmp/memory_snapshot.txt ]; then cat /tmp/memory_snapshot.txt; fi

      - name: Print current server logs
        if: always()
        run: if [ -f .testoutput/mixedbrain_process-current.log ]; then cat .testoutput/mixedbrain_process-current.log; fi

      - name: Print release server logs
        if: always()
        run: if [ -f .testoutput/mixedbrain_process-release.log ]; then cat .testoutput/mixedbrain_process-release.log; fi

      - name: Print Omes logs
        if: always()
        run: if [ -f .testoutput/mixedbrain_omes.log ]; then cat .testoutput/mixedbrain_omes.log; fi

  module-zip:
    name: Build module zip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.COMMIT }}
          path: src

      - uses: actions/setup-go@v6
        with:
          go-version-file: "src/go.mod"
          cache: false

      - name: Create module zip with golang.org/x/mod/zip
        run: |
          mkdir -p "$RUNNER_TEMP/helper" "$RUNNER_TEMP/out"
          cd "$RUNNER_TEMP/helper"
          go mod init helper
          go get golang.org/x/mod@v0.24.0
          cat > main.go <<'EOF'
          package main

          import (
              "log"
              "os"

              "golang.org/x/mod/module"
              "golang.org/x/mod/zip"
          )

          func main() {
              dir, path, version, out := os.Args[1], os.Args[2], os.Args[3], os.Args[4]
              f, err := os.Create(out)
              if err != nil {
                  log.Fatal(err)
              }
              defer f.Close()
              if err := zip.CreateFromDir(f, module.Version{Path: path, Version: version}, dir); err != nil {
                  log.Fatal(err)
              }
          }
          EOF
          go build -o create_mod .
          ./create_mod "$GITHUB_WORKSPACE/src" go.temporal.io/server v1.31.0 "$RUNNER_TEMP/out/v1.31.0.zip"
          unzip -l "$RUNNER_TEMP/out/v1.31.0.zip" | tail -1

      - name: Upload module zip
        uses: actions/upload-artifact@v6
        with:
          name: go-module-zip
          path: ${{ runner.temp }}/out/v1.31.0.zip
          if-no-files-found: error

  test-status:
    if: always()
    name: Test Status
    needs:
      - misc-checks
      - unit-test
      - integration-test
      - functional-test
      - module-zip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RESULTS: ${{ toJSON(needs.*.result) }}
    steps:
      - name: Check results
        run: |
          # all statuses must be success
          if [[ -n $(echo "$RESULTS" | jq '.[] | select (. != "success")') ]]; then
            exit 1
          fi

  notify-failure:
    name: Notify Slack on Failure
    if: false
    needs: test-status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Send Slack notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
        run: |
          go run ./cmd/tools/ci-notify alert \
            --run-id "${{ github.run_id }}" \
            --slack-webhook "$SLACK_WEBHOOK"
